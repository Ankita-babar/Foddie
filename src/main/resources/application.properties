spring.application.name=foodie
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/foodie?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.data.mongodb.uri=mongodb://localhost:27017/foodie?serverSelectionTimeoutMS=3000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
